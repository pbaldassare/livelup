# Template: copy to .github/workflows/sync-supabase-auth-redirects.yml
# (repo root) to run on every push to main. Requires secret SUPABASE_ACCESS_TOKEN.
# See docs/DEPLOY-CLOUDFLARE.md

name: Sync Supabase Auth redirects

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supabase-auth-sync-${{ github.repository }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.fork }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Merge Pages redirect URLs into Supabase Auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/sync-supabase-auth-redirects.mjs
